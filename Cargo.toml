[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED" # Definir após revisão de licenças (seção 17.2)
publish = false

[workspace.dependencies]
hearphant-dose = { path = "crates/hearphant-dose" }
hearphant-audio = { path = "crates/hearphant-audio" }
hearphant-storage = { path = "crates/hearphant-storage" }
hearphant-calibration = { path = "crates/hearphant-calibration" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time", "sync", "signal"] }
zbus = { version = "4.4", default-features = false, features = ["tokio"] }
